name: Test Workflow
on: [push]
jobs:
  test:
    name: Test (${{ matrix.os }})
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code from repository
        uses: actions/checkout@v6
      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Print Node.js information
        run: node --version
      - name: Install package
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: Run the action
        uses: ./
        with:
          remove-tools: false
